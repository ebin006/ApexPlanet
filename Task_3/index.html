<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Advanced Web Development</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Interactive Web Features</h1>
    </header>

    <section class="quiz-section">
        <h2>JavaScript Quiz</h2>
        <div id="quiz-container">
            <p id="question">Loading question...</p>
            <button onclick="checkAnswer(true)">True</button>
            <button onclick="checkAnswer(false)">False</button>
            <p id="quiz-message"></p>
        </div>
    </section>

    <section class="carousel-section">
        <h2>Image Carousel</h2>
        <div class="carousel">
            <img id="carousel-image" src="images/image1.jpg" alt="Carousel Image">
            <button onclick="prevImage()">&#10094;</button>
            <button onclick="nextImage()">&#10095;</button>
        </div>
    </section>

    <section class="api-section">
        <h2>Random Joke Generator</h2>
        <button onclick="fetchJoke()">Get a Joke</button>
        <p id="joke"></p>
    </section>

    <footer>
        <p>Created for Task 3</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
